name: Build iOS App

on:
  push:
    branches: [ main, cachewipe ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Build (no signing)
      run: |
        xcodebuild build \
          -project IOSurfaceSafeProbe.xcodeproj \
          -scheme IOSurfaceSafeProbe \
          -destination 'generic/platform=iOS' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          DEVELOPMENT_TEAM="" \
          | tail -20
    
    - name: Archive (unsigned IPA)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        xcodebuild archive \
          -project IOSurfaceSafeProbe.xcodeproj \
          -scheme IOSurfaceSafeProbe \
          -destination 'generic/platform=iOS' \
          -archivePath build/IOSurfaceSafeProbe.xcarchive \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          DEVELOPMENT_TEAM="" \
          | tail -20
    
    - name: Create IPA
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        mkdir -p build/Payload
        cp -r build/IOSurfaceSafeProbe.xcarchive/Products/Applications/IOSurfaceSafeProbe.app build/Payload/
        cd build && zip -r IOSurfaceSafeProbe.ipa Payload/
    
    - name: Upload artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: IOSurfaceSafeProbe-unsigned
        path: build/IOSurfaceSafeProbe.ipa
