name: Build iOS App

on:
  push:
    branches: [ main, cachewipe ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode 26.3
      run: |
        sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
        xcodebuild -version
        xcodebuild -showsdks | grep iphoneos

    - name: Build Release (no signing)
      run: |
        xcodebuild build \
          -project IOSurfaceSafeProbe.xcodeproj \
          -scheme IOSurfaceSafeProbe \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          DEVELOPMENT_TEAM="" \
          IPHONEOS_DEPLOYMENT_TARGET=26.0

    - name: Strip any code signature
      run: |
        codesign --remove-signature build/DerivedData/Build/Products/Release-iphoneos/IOSurfaceSafeProbe.app/IOSurfaceSafeProbe 2>/dev/null || true
        echo "Binary has no code signature (matches reference apps)"

    - name: Create IPA
      run: |
        mkdir -p build/Payload
        cp -r build/DerivedData/Build/Products/Release-iphoneos/IOSurfaceSafeProbe.app build/Payload/
        cd build && zip -r IOSurfaceSafeProbe.ipa Payload/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: IOSurfaceSafeProbe-unsigned
        path: build/IOSurfaceSafeProbe.ipa
