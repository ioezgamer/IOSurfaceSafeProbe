name: Compilar IOSurface Preflight IPA
on:
  push:
    branches: [main, preflight-ipa, feat/iosurface-preflight-v19-2-coverage, feat/iosurface-preflight-v19-3-format-coverage, feat/iosurface-preflight-v19-4-bounded-bruteforce-batch, feat/iosurface-preflight-v19-5-effective-coverage, feat/iosurface-preflight-v19-6-stratified-coverage, feat/iosurface-preflight-v19-7-targeted-replay, feat/iosurface-preflight-v19-8-mach-port-ownership, feat/iosurface-preflight-v19-9-port-revocation, feat/iosurface-preflight-v19-10-forensic-export, feat/iosurface-preflight-v19-12-import-kernel-traces]
    paths:
      - 'IOSurfacePreflight/**'
      - '.github/workflows/ios-preflight-ipa.yml'
  pull_request:
    branches: [main, fix/iosurface-preflight-v19-reboot-diagnostics]
    paths:
      - 'IOSurfacePreflight/**'
      - '.github/workflows/ios-preflight-ipa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Pruebas del clasificador de reinicios (C11)
        run: |
          clang -std=c11 -Wall -Wextra -Werror \
            IOSurfacePreflight/Tests/PFBootClassifierTests.c -lm \
            -o "$RUNNER_TEMP/pf-boot-tests"
          "$RUNNER_TEMP/pf-boot-tests"
      - name: Pruebas de formato y exclusiones de memoria
        run: |
          clang -std=c11 -Wall -Wextra -Werror \
            IOSurfacePreflight/Tests/PFMemoryEligibilityTests.c \
            -o "$RUNNER_TEMP/pf-memory-tests"
          "$RUNNER_TEMP/pf-memory-tests"
      - name: Pruebas de lotes acotados (C11)
        run: |
          clang -std=c11 -Wall -Wextra -Werror \
            IOSurfacePreflight/Tests/PFBoundedBatchTests.c \
            -o "$RUNNER_TEMP/pf-batch-tests"
          "$RUNNER_TEMP/pf-batch-tests"
      - name: Pruebas de novedad y clave canonica (C11)
        run: |
          clang -std=c11 -Wall -Wextra -Werror \
            IOSurfacePreflight/Tests/PFNoveltyCoverageTests.c \
            -o "$RUNNER_TEMP/pf-novelty-tests"
          "$RUNNER_TEMP/pf-novelty-tests"
      - name: Simulacion reproducible de 200000 candidatos (sin IPC)
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            IOSurfacePreflight/Tests/PFNoveltySimulationTests.c \
            -o "$RUNNER_TEMP/pf-novelty-sim"
          "$RUNNER_TEMP/pf-novelty-sim"
      - name: Pruebas de selección de caso CSV para reproducción dirigida (C11)
        run: |
          clang -std=c11 -Wall -Wextra -Werror \
            IOSurfacePreflight/Tests/PFTargetedReplayTests.c \
            -o "$RUNNER_TEMP/pf-targeted-tests"
          "$RUNNER_TEMP/pf-targeted-tests"
      - name: Verificar patrón real de píxeles y límites (C11)
        run: |
          clang -std=c11 -Wall -Wextra -Werror \
            IOSurfacePreflight/Tests/PFMachPortPatternTests.c \
            -o "$RUNNER_TEMP/pf-mach-pattern-tests"
          "$RUNNER_TEMP/pf-mach-pattern-tests"
      - name: Verificar clasificador de revocacion de puertos Mach (C11)
        run: |
          clang -std=c11 -Wall -Wextra -Werror \
            IOSurfacePreflight/Tests/PFPortRevocationClassifierTests.c \
            -o "$RUNNER_TEMP/pf-port-revocation-tests"
          "$RUNNER_TEMP/pf-port-revocation-tests"
      - name: Pruebas forenses locales v19.10 (cinco comprobaciones)
        run: |
          clang -fobjc-arc -Wall -Wextra \
            -I IOSurfacePreflight/Sources \
            IOSurfacePreflight/Sources/PFForensicEvidence.m \
            IOSurfacePreflight/Tests/PFForensicEvidenceTests.m \
            -framework Foundation \
            -o "$RUNNER_TEMP/pf-forensic-tests"
          "$RUNNER_TEMP/pf-forensic-tests"
      - name: Pruebas de importación y correlación pasiva de trazas externas (9 controles)
        run: |
          clang -fobjc-arc -Wall -Wextra \
            -I IOSurfacePreflight/Sources \
            IOSurfacePreflight/Sources/PFKernelTraceImporter.m \
            IOSurfacePreflight/Tests/PFKernelTraceImporterTests.m \
            -framework Foundation \
            -o "$RUNNER_TEMP/pf-kernel-trace-import-tests"
          "$RUNNER_TEMP/pf-kernel-trace-import-tests"
      - name: Generar proyecto
        working-directory: IOSurfacePreflight
        run: xcodegen generate
      - name: Compilar iPhone (sin firma)
        run: |
          xcodebuild -project IOSurfacePreflight/IOSurfacePreflight.xcodeproj \
            -scheme IOSurfacePreflight -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/preflight-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verificar versión real del Info.plist
        run: |
          INFO="$RUNNER_TEMP/preflight-build/Build/Products/Release-iphoneos/IOSurfacePreflight.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")" = "0.19.12"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" = "31"
          test -f "$RUNNER_TEMP/preflight-build/Build/Products/Release-iphoneos/IOSurfacePreflight.app/PrivacyInfo.xcprivacy"
          python3 - "$INFO" <<'PY'
          import plistlib
          import sys
          with open(sys.argv[1], 'rb') as fp:
              p = plistlib.load(fp)
          assert p.get("UIFileSharingEnabled") is True, p.get("UIFileSharingEnabled")
          assert p.get("LSSupportsOpeningDocumentsInPlace") is True, p.get("LSSupportsOpeningDocumentsInPlace")
          print("Files app access: enabled")
          PY
      - name: Crear IPA
        run: |
          mkdir -p "$RUNNER_TEMP/preflight-pkg/Payload"
          cp -R "$RUNNER_TEMP/preflight-build/Build/Products/Release-iphoneos/IOSurfacePreflight.app" \
            "$RUNNER_TEMP/preflight-pkg/Payload/"
          (cd "$RUNNER_TEMP/preflight-pkg" && zip -qr "$GITHUB_WORKSPACE/IOSurfacePreflight-unsigned.ipa" Payload)
          shasum -a 256 "$GITHUB_WORKSPACE/IOSurfacePreflight-unsigned.ipa"
      - name: Publicar artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: IOSurfacePreflight-unsigned-ipa
          path: IOSurfacePreflight-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
