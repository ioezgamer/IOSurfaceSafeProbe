name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths: [ source.json ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Publish to gh-pages branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Create or update gh-pages branch with just source.json
        git fetch origin gh-pages 2>/dev/null || true
        git checkout --orphan gh-pages-tmp
        git reset --hard

        cp source.json source.json.tmp
        git checkout main -- source.json 2>/dev/null || cp source.json.tmp source.json

        cat > index.html <<'EOF'
        <!DOCTYPE html>
        <html><head><meta charset="utf-8"><title>CacheWipe</title></head>
        <body>
        <h1>CacheWipe</h1>
        <p>FlareStore source URL:</p>
        <code>https://ioezgamer.github.io/IOSurfaceSafeProbe/source.json</code>
        </body></html>
        EOF

        git add source.json index.html
        git commit -m "deploy: update source.json"
        git push origin HEAD:gh-pages --force
