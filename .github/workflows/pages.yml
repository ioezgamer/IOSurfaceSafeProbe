name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths: [ source.json ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Publish to gh-pages branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Save source.json before switching branches
        cp source.json /tmp/source.json

        cat > /tmp/index.html <<'EOF'
        <!DOCTYPE html>
        <html><head><meta charset="utf-8"><title>CacheWipe</title></head>
        <body>
        <h1>CacheWipe</h1>
        <p>FlareStore source URL:</p>
        <code>https://ioezgamer.github.io/IOSurfaceSafeProbe/source.json</code>
        </body></html>
        EOF

        # Create orphan branch with only source.json and index.html
        git checkout --orphan gh-pages-tmp
        git reset --hard

        cp /tmp/source.json source.json
        cp /tmp/index.html index.html

        git add source.json index.html
        git commit -m "deploy: update source.json"
        git push origin HEAD:gh-pages --force
