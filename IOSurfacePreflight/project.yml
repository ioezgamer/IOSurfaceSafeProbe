name: IOSurfacePreflight
options:
  bundleIdPrefix: org.iosurface
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CLANG_ENABLE_OBJC_ARC: "YES"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  IOSurfacePreflight:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: IOSurface Preflight
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.iosurface.preflight
        MARKETING_VERSION: "0.19.12"
        CURRENT_PROJECT_VERSION: "31"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleShortVersionString: "0.19.12"
        INFOPLIST_KEY_CFBundleVersion: "31"
        INFOPLIST_KEY_CFBundleDisplayName: "IOSurface Preflight"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "NO"
    dependencies:
      - sdk: IOSurface.framework
