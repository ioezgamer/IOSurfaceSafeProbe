name: BackboarddEvidence
options:
  bundleIdPrefix: org.backboarddevidence
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CLANG_ENABLE_OBJC_ARC: "YES"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BackboarddEvidence:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.backboarddevidence.inspector
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Backboardd Evidence"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "NO"
