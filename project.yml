name: IOSurfaceSafeProbe
options:
  bundleIdPrefix: org.iosurface.research
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  IOSurfaceSafeProbe:
    type: application
    platform: iOS
    sources:
      - IOSurfaceSafeProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ioezgamer.IOSurfaceSafeProbe
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: IOSurfaceSafeProbe/IOSurfaceSafeProbe-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: IOSurfaceSafeProbe/IOSurfaceSafeProbe.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: "CacheWipe"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    dependencies:
      - sdk: IOSurface.framework
      - sdk: CoreGraphics.framework
